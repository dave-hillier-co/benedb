name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: benedb

    steps:
      # TWO CHECKOUTS, SIDE BY SIDE. BeneDB reaches Thresh through
      # `link:../../../thresh/packages/*` — a relative path into a SIBLING
      # checkout — so a lone checkout of this repository cannot install. Both
      # trees go under the workspace as `benedb/` and `thresh/`, which is the
      # layout that link resolves against: benedb/packages/core/../../../thresh.
      #
      # Checking out Thresh at `main` rather than pinning a SHA is deliberate.
      # The absence of a registry between the two repositories is load-bearing
      # (see docs/packaging.md): BeneDB exists to surface Thresh bugs, and a
      # Thresh change that breaks BeneDB must fail here, not sit behind a pin
      # waiting to be noticed.
      - uses: actions/checkout@v4
        with:
          path: benedb

      - uses: actions/checkout@v4
        with:
          repository: dave-hillier-co/thresh
          path: thresh

      # The runner service starts from a minimal PATH, so Homebrew's bin — where
      # docker lives — is added explicitly. Via GITHUB_PATH rather than a
      # workflow-level `env.PATH`, because that would override what `setup-node`
      # puts on the path and the toolchain would vanish again.
      - name: Add Homebrew to PATH
        working-directory: .
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      # Node comes from the tool cache rather than whatever the runner happens
      # to have installed, so CI runs the version the repository is developed on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # protoc is not installed on the runner, and `packages/protos/scripts/generate.sh`
      # needs the binary (the ts-proto plugin itself comes from node_modules). Taking
      # it from the action rather than asking the runner to have it keeps the job
      # self-describing — nothing has to be provisioned by hand for a new runner.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fails loudly and early when the runner is missing a tool, rather than
      # midway through an install with an error that names something else.
      - name: Tool versions
        run: |
          corepack enable
          node --version
          pnpm --version
          docker --version
          docker info --format "{{.ServerVersion}}"
          protoc --version

      # THE ORPHANED-HOST GUARD, first half. CLAUDE.md forbids starting a host
      # from a test or from CI, because a backgrounded host orphans and runs
      # forever. On a SELF-HOSTED runner that is not hypothetical: the orphan
      # outlives the job on a real machine and holds its ports until someone
      # notices. So the rule is enforced here rather than only written down.
      #
      # A snapshot, NOT a bare "nothing is listening" assertion. The runner is a
      # shared machine and these are ordinary development ports — 8080 above all
      # — so anything bound before the job started is somebody else's and must
      # not fail this run. Only a port that APPEARS across the job is evidence
      # that the job started a host.
      - name: Record listening ports
        run: |
          for port in 50051 8080 11111 11112; do
            lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1 && echo "$port"
          done > "$RUNNER_TEMP/ports-before.txt" || true
          cat "$RUNNER_TEMP/ports-before.txt"

      - name: Install
        run: pnpm install --frozen-lockfile

      # `packages/protos/generated` is NOT committed — the vendored `.proto`
      # files are, and the TypeScript is regenerated from them. A fresh checkout
      # therefore has no protos at all, and everything downstream fails on a
      # missing module rather than on anything it is testing.
      - name: Generate protos
        run: pnpm --filter @benedb/protos generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit
        run: pnpm test

      - name: Conformance
        run: pnpm test:conformance

      # The only external oracle. It SKIPS rather than fails without Docker, so
      # a runner that lost its daemon would turn this into a silent pass — the
      # `docker info` check above is what stops that.
      - name: Differential
        run: pnpm test:differential

      - name: No host was left running
        if: always()
        run: |
          # No snapshot means the job failed before it could take one, so nothing
          # here can be attributed to it. Say so rather than blaming it for ports
          # that were already bound.
          if [ ! -f "$RUNNER_TEMP/ports-before.txt" ]; then
            echo "no snapshot was taken; skipping the orphan check"
            exit 0
          fi
          appeared=""
          for port in 50051 8080 11111 11112; do
            if lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1 &&
               ! grep -qx "$port" "$RUNNER_TEMP/ports-before.txt"; then
              appeared="$appeared $port"
              lsof -nP -iTCP:"$port" -sTCP:LISTEN
            fi
          done
          if [ -n "$appeared" ]; then
            echo "::error::a host is listening on$appeared and was not before this job — CI started one"
            exit 1
          fi
          echo "no host port was opened by this job"
